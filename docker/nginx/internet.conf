# Вход из интернета через ngrok (только рабочая копия, порт 8082 — внутри сети Docker,
# наружу не опубликован). ngrok пускает только после входа через Google и передаёт почту
# вошедшего в заголовке X-LFT-User (заголовок от клиента ngrok стирает, см. docker/ngrok/policy.yml).
# Здесь почта становится тем же заголовком, что ставит Tailscale, а пометка X-LFT-Channel
# говорит приложению проверить почту по списку доступа.

server {
    listen 8082;
    server_name _;

    root /var/www/html/public;
    index index.html;
    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Перекрывают то, что прислал клиент: личность — только от ngrok
        fastcgi_param HTTP_TAILSCALE_USER_LOGIN $http_x_lft_user;
        fastcgi_param HTTP_X_LFT_CHANNEL internet;
        fastcgi_param HTTP_X_DEMO_USER "";
        fastcgi_param HTTP_X_DEMO_MECHANIC "";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
