server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    # Интерфейс (index.html и /assets) отдаётся напрямую, всё остальное идёт в PHP-роутер
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
