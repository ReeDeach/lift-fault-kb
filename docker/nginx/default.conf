server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    # Фото к сообщениям приходят в JSON (data URL): телефон ужимает снимок до ~0,5 МБ,
    # сервер принимает до 3 МБ, в base64 это около 4 МБ
    client_max_body_size 6m;

    # Интерфейс (index.html и /assets) отдаётся напрямую, корень / открывает index.html,
    # всё остальное (/api/...) идёт в PHP-роутер
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Страница и ресурсы подключаются без номера версии, поэтому браузер перепроверяет их
    # при каждом открытии (по ETag, неизменённый файл не скачивается заново): правки сразу
    # доходят и до телефона
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service worker push-уведомлений и манифест приложения («На экран Домой») — тоже без кеша
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
