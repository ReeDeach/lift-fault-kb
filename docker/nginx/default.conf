server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    # Интерфейс (index.html и /assets) отдаётся напрямую, всё остальное идёт в PHP-роутер
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Страница проверяется при каждом открытии, чтобы новые ?v= сразу доходили до браузера
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # При изменении app.js или app.css поднимайте ?v= в index.html, иначе браузер час держит старую копию
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
