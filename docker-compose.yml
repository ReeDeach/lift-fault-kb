services:
  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Вход из интернета для ngrok: порт 8082 только внутри сети Docker
      - ./docker/nginx/internet.conf:/etc/nginx/conf.d/internet.conf:ro
    depends_on:
      - php

  php:
    restart: unless-stopped
    build:
      context: ./docker/php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      # Фото к сообщениям: вне папки проекта, у демо свой том
      - uploads:/var/www/uploads
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    restart: unless-stopped
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  manticore:
    restart: unless-stopped
    image: manticoresearch/manticore:29.9.0
    ports:
      - "127.0.0.1:9306:9306"
    volumes:
      - manticore-data:/var/lib/manticore

  # Доступ из интернета без Tailscale: ngrok с входом через Google (docker/ngrok/policy.yml).
  # Кого пускать, решает приложение: мастера, привязанные механики и список «Доступ».
  # Запуск: docker compose --profile tunnel up -d ngrok
  # NGROK_AUTHTOKEN и NGROK_DOMAIN — в .env (кабинет dashboard.ngrok.com).
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["http", "nginx:8082", "--url=${NGROK_DOMAIN:-}", "--traffic-policy-file=/etc/ngrok/policy.yml", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./docker/ngrok/policy.yml:/etc/ngrok/policy.yml:ro
    depends_on:
      - nginx

volumes:
  mysql-data:
  manticore-data:
  uploads:
