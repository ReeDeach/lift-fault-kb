<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Fault Terminal — база неисправностей лифтов</title>
<link rel="icon" href="/assets/img/lft-mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0e0c0b">
<meta name="apple-mobile-web-app-title" content="LFT">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>
  // Тема до отрисовки, чтобы страница не мигала: выбор пользователя, иначе тема телефона
  (function () {
    var t = null;
    try { t = localStorage.getItem('lft:theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  }());
</script>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div class="fp">
  <header class="fp-top">
    <a href="#/codes" class="app-logo"><img class="app-logo-dark" src="/assets/img/lft-wordmark.svg" alt="Lift Fault Terminal"><img class="app-logo-light" src="/assets/img/lft-wordmark-light.svg" alt="Lift Fault Terminal"></a>
    <nav class="fp-nav" aria-label="Разделы">
      <a href="#/codes" data-page="codes">Коды</a>
      <a href="#/journal" data-page="journal">Журнал случаев</a>
      <a href="#/ai" data-page="ai">ИИ-диагностика</a>
      <a href="#/repairs" data-page="requests">Заявки</a>
      <a href="#/chat" data-page="chat">Чат</a>
    </nav>
    <div class="fp-sys">
      <button type="button" class="lft-badge app-user" id="app-user" hidden title="Профиль и роль"></button>
      <button type="button" class="lft-badge app-theme" id="app-theme"></button>
      <button type="button" class="lft-badge app-theme app-push" id="app-push" hidden aria-label="Уведомления" title="Уведомления"><span class="lft-icon lft-icon--bell lft-icon--12" aria-hidden="true"></span></button>
      <span class="lft-badge app-status" id="app-status"><span class="lft-icon lft-icon--12"></span>связь…</span>
      <span class="lft-label" id="app-clock"></span>
    </div>
  </header>

  <p class="app-demo lft-label" id="app-demo" hidden>Демо-версия · все адреса, механики и записи вымышлены · после показа данные сбрасываются</p>

  <main id="app-view" class="app-view" aria-live="polite">
    <p class="lft-label app-loading">Загрузка</p>
  </main>

  <footer class="fp-bottom">
    <span class="lft-label">System status: <span id="app-system" class="ok">stable</span></span>
    <span class="lft-label">Справочник не заменяет РЭ производителя</span>
    <span class="lft-label">Keep going.exe</span>
  </footer>
</div>

<nav class="app-tabs" aria-label="Разделы">
  <a href="#/codes" data-page="codes"><span class="lft-icon lft-icon--code"></span>Коды</a>
  <a href="#/journal" data-page="journal"><span class="lft-icon lft-icon--journal"></span>Журнал</a>
  <a href="#/ai" data-page="ai"><span class="lft-icon lft-icon--chip"></span>ИИ</a>
  <a href="#/repairs" data-page="requests"><span class="lft-icon lft-icon--box"></span>Заявки</a>
  <a href="#/chat" data-page="chat"><span class="lft-icon lft-icon--chat"></span>Чат</a>
</nav>

<noscript><p class="lft-label" style="padding:24px">Для работы справочника включите JavaScript.</p></noscript>

<script src="/assets/vendor/jquery-3.7.1.min.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
